services:
  - type: worker
    name: astraai-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true

    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: MISTRAL_API_KEY
        sync: false

      - key: MISTRAL_API_URL
        value: https://api.mistral.ai/v1/chat/completions

      - key: MISTRAL_MODEL
        value: mistral-small-latest

      - key: DATABASE_URL
        sync: false
